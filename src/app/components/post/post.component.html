<div class="card" [ngStyle]="{ 'border-color': colors[index % colors.length] }">
  <span
    class="badge"
    [ngStyle]="{ 'background-color': colors[index % colors.length] }"
    aria-hidden="true"
    >No. {{ (total || index + 1) - index }}</span
  >
  <span
    class="title hoverable"
    tabindex="0"
    (click)="expand()"
    (keydown)="expand()"
  >
    {{ post.title }}
  </span>
  <p class="date">
    {{ post.date | timestampToDate: "date-only" }}
  </p>
  <hr />
  <div class="container">
    @if (post.image && imageFound) {
      <div class="imageWrap">
        <img
          class="postImage"
          [src]="post.image"
          (error)="imageError()"
          alt="Post Image"
        />
        <a
          class="imageLink"
          [href]="post.image"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="View full size image"
          ><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7" /></svg> Full size</a
        >
      </div>
    }
    <span [innerHTML]="textToShow"></span>
    @if (post.body.length > 700) {
      <a
        class="readMore hoverable"
        (click)="expand()"
        (keydown)="expand()"
        tabindex="{0}"
      >
        Read More</a
      >
    }
  </div>
  <hr />
  <a
    id="comments"
    class="hoverable"
    (click)="showComments()"
    (keydown)="showComments()"
    tabindex="{0}"
  >
    {{ commentCount === 0 ? "Leave a comment" : commentCount + " comment"
    }}{{ commentCount > 1 ? "s" : "" }}
  </a>
</div>
