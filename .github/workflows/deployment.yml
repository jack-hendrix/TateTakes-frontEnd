name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Step 2: Set up Node.js (match the version with your project)
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Set up the production environment file
      # The secret is passed through an env var rather than interpolated into
      # the script, so its contents are never parsed as shell.
      - name: Set up environment.prod.ts
        env:
          ENVIRONMENT_PROD: ${{ secrets.ENVIRONMENT_PROD }}
        run: |
          echo "Replacing environment.ts with environment.prod.ts"
          mkdir -p src/app/environments
          printf '%s\n' "$ENVIRONMENT_PROD" > src/app/environments/environment.ts
          printf '%s\n' "$ENVIRONMENT_PROD" > src/app/environments/environment.prod.ts

      # Step 5: Build the Angular project in production mode
      - name: Build Angular project
        run: npm run build

      - name: Verify build output directory before copy
        run: |
          echo "Listing files in the build directory:"
          ls -la /home/runner/work/TateTakes-frontEnd/TateTakes-frontEnd/dist/tate-blog/browser

      # Third-party actions that receive the SSH key are pinned to a commit so a
      # moved tag can't change the code that runs.
      # Upload the build files to the remote server
      - name: Upload build files to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "/home/runner/work/TateTakes-frontEnd/TateTakes-frontEnd/dist/tate-blog/browser/*"
          target: "/home/${{ secrets.SERVER_USER }}/TateTakes-frontEnd/"
          # Empty the upload folder first so old hashed bundles don't pile up
          # and get copied into the site on the next deploy.
          rm: true

      # Deploy to the server using SSH
      - name: Deploy to server
        uses: appleboy/ssh-action@d91a1af6f57cd4478ceee14d7705601dafabaa19 # v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            UPLOAD_DIR="/home/${{ secrets.SERVER_USER }}/TateTakes-frontEnd"

            # scp-action keeps part of the runner's path under the target
            # folder, so find the build instead of hard-coding where it lands.
            BUILD_DIR=$(find "$UPLOAD_DIR" -type d -path '*/dist/tate-blog/browser' | head -n 1)
            if [ -z "$BUILD_DIR" ] || [ ! -f "$BUILD_DIR/index.html" ]; then
              echo "No build found in $UPLOAD_DIR; leaving the live site untouched."
              exit 1
            fi
            echo "Deploying $BUILD_DIR"

            echo "Stopping nginx..."
            sudo systemctl stop nginx
            # Bring nginx back up even if a step below fails.
            trap 'echo "Starting nginx..."; sudo systemctl start nginx' EXIT

            echo "Replacing site files..."
            sudo rm -rf /var/www/tatetakes/*
            sudo cp -r "$BUILD_DIR"/. /var/www/tatetakes/

            # tateBlog-frontEnd is the upload folder from before the repo was
            # renamed; remove it too if it's still there.
            echo "Cleaning up upload folders..."
            rm -rf "$UPLOAD_DIR" "/home/${{ secrets.SERVER_USER }}/tateBlog-frontEnd"
