name: Test Pull Request

on:
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # environment.ts is git-ignored. The tests never reach Firebase, so a
      # placeholder config is enough and no secrets are needed.
      - name: Create test environment file
        run: |
          cat > src/app/environments/environment.ts <<'EOF'
          export const environment = {
            production: false,
            firebaseConfig: {
              apiKey: 'demo-api-key',
              authDomain: 'demo-tate-takes.firebaseapp.com',
              projectId: 'demo-tate-takes',
              storageBucket: 'demo-tate-takes.appspot.com',
              messagingSenderId: '0',
              appId: 'demo-app-id',
            },
          };
          EOF

      - name: Run tests
        run: npm run test:ci
